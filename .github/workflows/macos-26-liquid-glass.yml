name: macOS 26 Liquid Glass build and screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/macos-26-liquid-glass
    paths:
      - apps/macos/**
      - .github/workflows/macos-26-liquid-glass.yml

permissions:
  contents: read

concurrency:
  group: macos-26-liquid-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshots:
    name: Native Tahoe app and screenshot gallery
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/macos
    env:
      MAX_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Record the real macOS and Xcode environment
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
          } | tee "${{ github.workspace }}/artifacts/environment.txt"

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -print -quit)" "$HOME/.local/bin/xcodegen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate deterministic Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Build native macOS application
        run: |
          set -o pipefail
          xcodebuild -project MaxMac.xcodeproj -scheme MaxMac \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MaxMacDerivedData" \
            CODE_SIGNING_ALLOWED=NO build \
            | tee "${{ github.workspace }}/artifacts/build.log"

      - name: Run unit and UI screenshot tests
        run: |
          set -o pipefail
          mkdir -p "$MAX_SCREENSHOT_DIR"
          xcodebuild -project MaxMac.xcodeproj -scheme MaxMac \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MaxMacTestDerivedData" \
            -resultBundlePath "${{ github.workspace }}/artifacts/MaxMac.xcresult" \
            CODE_SIGNING_ALLOWED=NO test \
            | tee "${{ github.workspace }}/artifacts/test.log"

      - name: Export screenshot attachments as fallback
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "${{ github.workspace }}/artifacts/xcresult-attachments"
          xcrun xcresulttool export attachments \
            --path "${{ github.workspace }}/artifacts/MaxMac.xcresult" \
            --output-path "${{ github.workspace }}/artifacts/xcresult-attachments"

      - name: Package the built Tahoe application
        if: success()
        run: |
          APP_PATH="$RUNNER_TEMP/MaxMacDerivedData/Build/Products/Release/Max.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ github.workspace }}/artifacts/Max-macOS-26-Tahoe.zip"
          shasum -a 256 "${{ github.workspace }}/artifacts/Max-macOS-26-Tahoe.zip" \
            | tee "${{ github.workspace }}/artifacts/Max-macOS-26-Tahoe.zip.sha256"

      - name: Build screenshot manifest
        if: always()
        run: |
          {
            echo '# Max macOS 26 screenshot gallery'
            echo
            echo "Generated by GitHub Actions run $GITHUB_RUN_ID on $(date -u '+%Y-%m-%dT%H:%M:%SZ')."
            echo
            find "$MAX_SCREENSHOT_DIR" -type f -name '*.png' -print 2>/dev/null \
              | sort \
              | while read -r image; do
                  file_name="$(basename "$image")"
                  bytes="$(stat -f '%z' "$image")"
                  echo "- $file_name ($bytes bytes)"
                done
          } > "${{ github.workspace }}/artifacts/SCREENSHOTS.md"
          find "$MAX_SCREENSHOT_DIR" -type f -name '*.png' -print 2>/dev/null | sort \
            > "${{ github.workspace }}/artifacts/screenshots.txt"

      - name: Upload app, logs, xcresult, and PNG gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Max-macOS-26-Tahoe-app-and-screenshots
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

